name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com

  server:
    name: Server typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  deploy:
    name: Deploy EC2
    needs: [client, server]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: EC2_HOST
    steps:
      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          [ -z "$EC2_HOST" ] && echo "Missing repo secret EC2_HOST" && missing=1
          [ -z "$EC2_USER" ] && echo "Missing repo secret EC2_USER" && missing=1
          [ -z "$EC2_SSH_KEY" ] && echo "Missing repo secret EC2_SSH_KEY" && missing=1
          exit $missing
      - name: SSH and rebuild
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/devCollab
            git fetch origin main
            git reset --hard origin/main
            if [ -f ./client/.env ]; then
              set -a
              . ./client/.env
              set +a
            fi
            export COMPOSE_BAKE=false
            docker compose up --build -d
            docker compose ps
