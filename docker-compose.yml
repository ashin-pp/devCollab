services:
  mongo:
    profiles: ["local-mongo"]
    image: mongo:7.0.14
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000

  # TLS + reverse proxy for api.devcollab.space only (frontend lives on Amplify)
  api-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/api-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - server

volumes:
  mongo_data:
