# Interpolation: client/.env supplies VITE_* for the image build.
# Runtime secrets: server/.env via the server service env_file (not this block).
env_file:
  - path: ./client/.env
    required: false

services:
  mongo:
    profiles: ["local-mongo"]
    image: mongo:7.0.14
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # CLIENT_URL, MONGO_URI, JWT, etc. come only from server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
